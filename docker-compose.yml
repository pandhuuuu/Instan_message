services:
  # Service Database MongoDB
  mongodb:
    image: mongo:latest
    container_name: mern-chat-mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  # Service Web & Socket App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern-chat-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chat-app
      - JWT_SECRET=${JWT_SECRET:-chat_app_secret_production_2026}
      - NODE_ENV=production
    depends_on:
      - mongodb

  # Service Web GUI Viewer Database (Buka di browser lokal: http://localhost:8888)
  mongo-express:
    image: mongo-express:latest
    container_name: mern-chat-mongo-express
    restart: always
    ports:
      - "127.0.0.1:8888:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-AdminSecurityPass2026!}
    depends_on:
      - mongodb

volumes:
  mongo_data:
